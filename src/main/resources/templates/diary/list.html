<!doctype html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, user-scalable=no, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="ie=edge">
    <title>일지 목록</title>
    <style th:replace="~{fragments/font :: font}"></style>
    <style>
        * {
            box-sizing: border-box;
        }

        body {
            font-family: 'Pretendard', sans-serif;
            max-width: 800px;
            margin: 0 auto;
            padding: 20px;
            color: #333;
            line-height: 1.6;
        }

        header {
            margin-bottom: 24px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid #ddd;
            padding-bottom: 16px;
        }

        header p {
            margin: 0;
            font-size: 24px;
            font-weight: bold;
        }

        nav ul {
            list-style: none;
            padding: 0;
            margin: 0;
        }

        nav a {
            display: inline-block;
            text-decoration: none;
            background-color: #4a90e2;
            color: white;
            padding: 8px 16px;
            border-radius: 4px;
            font-weight: 500;
            transition: background-color 0.2s ease;
        }

        nav a:hover {
            background-color: #357ab8;
        }

        main {
            padding: 16px 0;
        }

        ol {
            list-style-position: inside;
            padding: 0;
            margin: 0;
        }

        li {
            border: 1px solid #ddd;
            border-radius: 8px;
            padding: 16px;
            margin-bottom: 16px;
            transition: box-shadow 0.2s ease;
        }

        li:hover {
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
        }

        li p {
            margin: 0;
        }

        @media (max-width: 600px) {
            body {
                padding: 16px;
            }

            header {
                flex-direction: column;
                align-items: flex-start;
                gap: 16px;
            }
        }
    </style>
</head>
<body>
<header>
    <p th:text="${message != null} ? ${message} : '일지 목록'"></p>
    <nav>
        <ul>
            <li>
                <a th:href="@{/diary/new}">일지 작성</a>
            </li>
        </ul>
    </nav>
</header>
<main>
    <div th:if="${#lists.isEmpty(list)}">
        <p>작성된 일지가 없습니다.</p>
    </div>
    <ol th:unless="${#lists.isEmpty(list)}">
        <li th:each="diary : ${list}">
            <p th:text="${diary}"></p>
        </li>
    </ol>
</main>
</body>
</html>
